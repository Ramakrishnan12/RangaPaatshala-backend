<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Registration Confirmation</title>
</head>
<body style="margin:0; padding:0; font-family: Arial, sans-serif; background-color:#f4f4f4;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color:#f4f4f4;">
    <tr>
      <td align="center" style="padding: 40px 0;">
        <table role="presentation" width="600" cellspacing="0" cellpadding="0" border="0" style="background:white; border-radius:8px; overflow:hidden;">
          <tr>
            <td style="background-color:#007BFF; padding:20px; color:#fff; text-align:center; font-size:24px;">
              Your Organization Name
            </td>
          </tr>
          <tr>
            <td style="padding: 30px;">
              <h2 style="color:#333;">Thank you for registering, {{student_name}}!</h2>
              <p style="color:#555;">We have successfully received your registration form.</p>
              <p style="color:#555;">
                <strong>Registration ID:</strong> {{registration_id}}<br />
                <strong>Email:</strong> {{student_email}}
              </p>
              <p style="color:#555;">We will get back to you with the next steps soon.</p>
            </td>
          </tr>
          <tr>
            <td style="background-color:#f1f1f1; padding:15px; text-align:center; color:#777;">
              © 2025 Your Organization | All rights reserved.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
